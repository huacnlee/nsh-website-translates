name: Translate

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translate

jobs:
  translate:
    if: vars.TRANSLATE_MODEL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install

      - run: bun test tests

      - name: Take the latest release's English pages
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/longbridge/nsh "$RUNNER_TEMP/nsh"
          cd "$RUNNER_TEMP/nsh"
          tag=$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          mkdir "$RUNNER_TEMP/source"
          git archive "$tag" website/docs website/elements website/modules | tar -x --strip-components=1 -C "$RUNNER_TEMP/source"

      - name: Translate
        env:
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_API_URL: ${{ vars.TRANSLATE_API_URL }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
        run: bun scripts/translate.js --source "$RUNNER_TEMP/source"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.NSH_WEBSITE_TOKEN }}
        run: |
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm 'Update translations'
          git push
          if [ -n "$GH_TOKEN" ]; then gh workflow run website.yml -R longbridge/nsh --ref main; fi
